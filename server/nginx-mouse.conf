server
{
    listen 80;
    server_name mouse.livepartner.fans;
    index index.html;
    root /www/wwwroot/mouse.livepartner.fans;

    gzip on;
    gzip_min_length 1k;
    gzip_comp_level 5;
    gzip_types text/plain text/css application/javascript application/json image/svg+xml;
    sendfile on;
    tcp_nopush on;
    client_max_body_size 32m;

    # 同源抓取网关：/api/fetch 由本机 Node 服务代抓目标页
    location /api/fetch {
        proxy_pass http://127.0.0.1:8092;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_connect_timeout 10s;
        proxy_read_timeout 60s;
        proxy_send_timeout 60s;
        proxy_buffering off;
    }

    # 服务端真实渲染采集：/api/capture 由无头 Chrome 渲染后返回布局+整页截图
    location /api/capture {
        proxy_pass http://127.0.0.1:8093;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_connect_timeout 10s;
        proxy_read_timeout 100s;
        proxy_send_timeout 60s;
        proxy_buffering off;
    }

    location / {
        try_files $uri $uri/ /index.html;
    }

    location ~* \.(png|jpg|jpeg|gif|webp|json|js|css|svg)$ {
        expires 1h;
        access_log off;
        try_files $uri =404;
    }

    access_log /www/wwwlogs/mouse.livepartner.fans.log;
    error_log /www/wwwlogs/mouse.livepartner.fans.error.log;
}

server
{
    listen 443 ssl http2;
    server_name mouse.livepartner.fans;
    index index.html;
    root /www/wwwroot/mouse.livepartner.fans;

    ssl_certificate     /www/server/panel/vhost/cert/mouse.livepartner.fans/fullchain.pem;
    ssl_certificate_key /www/server/panel/vhost/cert/mouse.livepartner.fans/privkey.pem;
    ssl_protocols TLSv1.2 TLSv1.3;
    ssl_ciphers EECDH+CHACHA20:EECDH+CHACHA20-draft:EECDH+AES128:RSA+AES128:EECDH+AES256:RSA+AES256:EECDH+3DES:RSA+3DES:!MD5;
    ssl_prefer_server_ciphers on;
    ssl_session_cache shared:SSL_mouse:10m;
    ssl_session_timeout 10m;
    add_header Strict-Transport-Security "max-age=31536000" always;

    gzip on;
    gzip_min_length 1k;
    gzip_comp_level 5;
    gzip_types text/plain text/css application/javascript application/json image/svg+xml;
    sendfile on;
    tcp_nopush on;
